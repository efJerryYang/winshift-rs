[package]
name = "winshift"
version = "0.0.5"
edition = "2021"
description = "A cross-platform window change hook library"
repository = "https://github.com/efJerryYang/winshift-rs"
authors = ["Jerry Yang <efjerryyang@outlook.com>"]
keywords = ["window", "hook", "focus", "change"]
categories = ["os", "api-bindings", "development-tools"]
license = "MIT"

[lib]
name = "winshift"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0.63"
chrono = "0.4.38"
colored = "2.1.0"
log = "0.4.22"
ctrlc = "3.4.5"
log4rs = "1.3.0"
env_logger = "0.11.8"

[dev-dependencies]
sysinfo = "0.37.2"

[features]
default = []
cargo-clippy = []


[target."cfg(windows)".dependencies]
windows = { version = "0.58.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21.0", features = ["xlib"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
core-foundation = "0.10.0"
core-graphics = "0.24.0"
objc2 = "0.2.7"
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
